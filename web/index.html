<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ketana Drishti - Vedic birth chart</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%239a3b1f%27/%3E%3Cpath d=%27M16 5l11 11-11 11L5 16z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2330; --muted:#667085; --line:#d9d4c7;
  --accent:#9a3b1f; --accent-ink:#ffffff; --soft:#f0ebe0; --good:#1f7a4d; --bad:#b42318; --focus:#2a5bd7;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161c; --card:#1d2029; --ink:#eceef3; --muted:#9aa3b5; --line:#343948;
    --accent:#e0825f; --accent-ink:#1b1209; --soft:#262a35; --good:#59c28d; --bad:#f08a80; --focus:#8fb0ff; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:1.6rem;letter-spacing:.01em}
.tag{margin:2px 0 0;color:var(--muted);font-size:.95rem}
main{max-width:1180px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
main>*,.chartwrap>*{min-width:0}
@media (min-width:920px){ main{grid-template-columns:340px minmax(0,1fr);align-items:start} .form-card{position:sticky;top:12px} }
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 12px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search]{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
input:focus-visible,button:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.row>div{min-width:0}
input[type=date],input[type=time]{min-width:0;font-size:.95rem;padding:10px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;margin-top:16px}
.btn:disabled{opacity:.6;cursor:progress}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-row .btn{flex:1 1 130px;font-size:.9rem}
.link{background:none;border:0;color:var(--accent);padding:6px 0;cursor:pointer;text-decoration:underline;min-height:0}
.status{margin-top:12px;font-size:.92rem;min-height:1.3em}
.status.err{color:var(--bad)} .status.ok{color:var(--good)}
details{margin-top:12px;font-size:.9rem} summary{cursor:pointer;color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
.sitelang{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:.85rem}
.sitelang select{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:36px}
.profrow{display:flex;gap:8px}
.profrow select{flex:1 1 auto;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.profrow .btn{flex:0 0 auto}
.combo{position:relative}
#placeList{position:absolute;z-index:20;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#placeList[hidden]{display:none}
#placeList li{padding:10px 12px;min-height:44px;display:flex;align-items:center;border-radius:8px;cursor:pointer;font-size:.95rem}
#placeList li[aria-selected=true],#placeList li:hover{background:var(--accent);color:var(--accent-ink)}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:0 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.meta{color:var(--muted);font-size:.85rem;margin:0 0 8px}
.chartwrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1080px){ .chartwrap{grid-template-columns:minmax(0,520px) minmax(0,1fr)} }
svg.chart{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;touch-action:manipulation}
svg .frame{fill:none;stroke:var(--ink);stroke-width:1.6}
svg .cell{fill:transparent;cursor:pointer}
svg .cell:hover,svg .cell.sel{fill:var(--soft)}
svg .cell.lagna{fill:color-mix(in srgb,var(--accent) 10%,transparent)}
svg .cell:focus-visible{outline:none;stroke:var(--focus);stroke-width:3}
svg text{fill:var(--ink);font-family:inherit;pointer-events:none}
svg .pl{font-size:13px;pointer-events:all;cursor:pointer}
svg .pl.sel{font-weight:700;fill:var(--accent);text-decoration:underline}
svg .pl:focus-visible{outline:none;text-decoration:underline}
svg .sn{font-size:11px;fill:var(--muted)}
svg .ctr{font-size:13px;fill:var(--muted)}
.empty{padding:36px 12px;text-align:center;color:var(--muted)}
.detail{background:var(--soft);border-radius:12px;padding:12px 14px;min-height:120px}
.detail h3{margin:0 0 6px;font-size:1rem}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.92rem}
.detail dt{color:var(--muted)} .detail dd{margin:0}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tablewrap{overflow-x:auto}
.rform{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:10px}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.rform input,.rform select{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card,transparent);color:var(--ink);font:inherit}
.rform .grow{flex:1 1 220px}
.rform [hidden]{display:none}
.rlist{padding-left:2.2em;display:grid;gap:12px;margin:12px 0}
.chip{display:inline-block;margin:4px 6px 0 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--muted);cursor:help}
.rnote{font-size:.85rem;color:var(--muted);margin-top:10px}
.pchip{border-style:dashed}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tbody tr{cursor:pointer} tbody tr:hover,tbody tr.sel{background:var(--soft)}
.facts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.facts li{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.facts code{font-size:.78rem;color:var(--muted);word-break:break-all}
.facts .id{font-weight:600;font-size:.82rem;color:var(--accent)}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.cards .c{border:1px solid var(--line);border-radius:12px;padding:12px}
.cards .c b{display:block;font-size:1.05rem}
.cards .c span{color:var(--muted);font-size:.85rem}
.badge{display:inline-block;padding:0 8px;border-radius:999px;font-size:.75rem;background:var(--soft);margin-left:4px}
footer{max-width:1180px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:.8rem}
.sr{position:absolute;left:-9999px}
@media print{ .form-card,.tabs,.btn-row,.seg,footer{display:none} main{display:block} body{background:#fff} }
</style>
</head>
<body>
<header>
  <h1>Ketana Drishti</h1>
  <p class="tag" data-i="tag"></p>
  <label class="sitelang" for="siteLang"><span data-i="siteLang"></span> <select id="siteLang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="gu">ગુજરાતી</option></select></label>
</header>
<main>
  <section class="card form-card" aria-labelledby="fh">
    <h2 id="fh" data-i="birthDetails"></h2>
    <form id="form" novalidate>
      <div id="profBlock" hidden>
        <label for="profSel" data-i="savedPeople"></label>
        <div class="profrow">
          <select id="profSel" data-ia="ariaSaved"></select>
          <button type="button" class="btn" id="profLoad" data-i="load"></button>
          <button type="button" class="btn" id="profDel" data-i="delete"></button>
        </div>
      </div>
      <label for="name" data-i="nameOpt"></label>
      <input id="name" type="text" maxlength="80" autocomplete="off">
      <div class="row">
        <div><label for="date" data-i="dob"></label><input id="date" type="date" required min="1900-01-01"></div>
        <div><label for="time" data-i="tob"></label><input id="time" type="time" required></div>
      </div>
      <div id="placeBlock">
        <label for="place" data-i="pob"></label>
        <div class="combo">
          <input id="place" type="text" data-ip="phPlace" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="placeList" aria-autocomplete="list">
          <ul id="placeList" role="listbox" hidden></ul>
        </div>
        <p class="hint" id="placeHint" hidden></p>
        <button type="button" class="link" id="toCoords" data-i="toCoords"></button>
      </div>
      <div id="coordBlock" hidden>
        <div class="row">
          <div><label for="lat" data-i="lat"></label><input id="lat" type="number" step="any" min="-90" max="90" placeholder="23.03"></div>
          <div><label for="lon" data-i="lon"></label><input id="lon" type="number" step="any" min="-180" max="180" placeholder="72.58"></div>
        </div>
        <p class="hint" data-i="northEast"></p>
        <button type="button" class="link" id="toPlace" data-i="toPlace"></button>
      </div>
      <label for="asof" data-i="dashaAsOf"></label>
      <input id="asof" type="date">
      <button class="btn primary" id="go" type="submit" data-i="generate"></button>
      <div class="btn-row">
        <button type="button" class="btn" id="profSave" data-i="saveDetails"></button>
        <button type="button" class="btn" id="sample" data-i="trySample"></button>
        <button type="button" class="btn" id="loadBtn" data-i="loadJson"></button>
      </div>
      <input id="file" type="file" accept="application/json,.json" hidden>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <details>
        <summary data-i="advanced"></summary>
        <label for="api" data-i="serverUrl"></label>
        <input id="api" type="url" data-ip="phApi" autocomplete="off" spellcheck="false">
        <p class="hint" data-i="privacyHint"></p>
      </details>
    </form>
  </section>

  <section class="card" id="result" aria-labelledby="rh">
    <h2 id="rh" data-i="yourChart"></h2>
    <div id="empty" class="empty" data-i="emptyMsg"></div>
    <div id="out" hidden>
      <div class="chart-head">
        <div><strong id="title"></strong><p class="meta" id="meta"></p></div>
        <div class="seg" role="group" data-ia="ariaChartStyle">
          <button type="button" id="sN" aria-pressed="true" data-i="northInd"></button>
          <button type="button" id="sS" aria-pressed="false" data-i="southInd"></button>
        </div>
      </div>
      <div class="chartwrap">
        <div>
          <div id="chartHost"></div>
          <p class="legend" data-i="legend"></p>
        </div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
      <div class="tabs" role="tablist" data-ia="ariaChartData">
        <button role="tab" id="t1" aria-selected="true" aria-controls="p1" data-i="tabPlanets"></button>
        <button role="tab" id="t2" aria-selected="false" aria-controls="p2" data-i="tabFacts"></button>
        <button role="tab" id="t3" aria-selected="false" aria-controls="p3" data-i="tabDasha"></button>
        <button role="tab" id="t4" aria-selected="false" aria-controls="p4" data-i="tabReading"></button>
      </div>
      <div id="p1" role="tabpanel" aria-labelledby="t1"></div>
      <div id="p2" role="tabpanel" aria-labelledby="t2" hidden></div>
      <div id="p3" role="tabpanel" aria-labelledby="t3" hidden></div>
      <div id="p4" role="tabpanel" aria-labelledby="t4" hidden>
        <div class="rform">
          <label><span data-i="language"></span>
            <select id="rlang"><option value="en">English</option><option value="hi">हिन्दी</option><option value="gu">ગુજરાતી</option></select>
          </label>
          <label id="rmodeWrap" hidden><span data-i="style"></span>
            <select id="rmode"><option value="classic" data-i="styleClassic"></option><option value="ai" data-i="styleAi"></option></select>
          </label>
          <label class="grow" id="rqWrap" hidden><span data-i="question"></span>
            <input id="rq" maxlength="200" data-ip="phQuestion">
          </label>
          <button type="button" class="btn" id="rgo" data-i="genReading"></button>
        </div>
        <p class="hint" id="rstatus" aria-live="polite"></p>
        <div id="rout"></div>
      </div>
      <div class="btn-row">
        <button type="button" class="btn" id="dl" data-i="download"></button>
        <button type="button" class="btn" id="print" data-i="print"></button>
      </div>
    </div>
  </section>
</main>
<footer data-i="footer"></footer>

<script src="lang.js"></script>
<script>
"use strict";
const SIGNS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const ABBR={Sun:"Su",Moon:"Mo",Mars:"Ma",Mercury:"Me",Jupiter:"Ju",Venus:"Ve",Saturn:"Sa",Rahu:"Ra",Ketu:"Ke"};
const DIGN={exalted:["↑","exalted"],debilitated:["↓","debilitated"],own_sign:["●","own sign"],moolatrikona:["◆","moolatrikona"]};
const NORTH={
  1:{p:"200,200 100,100 200,0 300,100",c:[200,80],n:[200,166]},
  2:{p:"0,0 200,0 100,100",c:[100,38],n:[100,80]},
  3:{p:"0,0 100,100 0,200",c:[38,100],n:[76,100]},
  4:{p:"0,200 100,100 200,200 100,300",c:[88,200],n:[158,200]},
  5:{p:"0,200 100,300 0,400",c:[38,300],n:[76,300]},
  6:{p:"0,400 100,300 200,400",c:[100,360],n:[100,322]},
  7:{p:"200,400 100,300 200,200 300,300",c:[200,320],n:[200,238]},
  8:{p:"200,400 300,300 400,400",c:[300,360],n:[300,322]},
  9:{p:"400,400 300,300 400,200",c:[362,300],n:[324,300]},
  10:{p:"400,200 300,300 200,200 300,100",c:[312,200],n:[242,200]},
  11:{p:"400,200 300,100 400,0",c:[362,100],n:[324,100]},
  12:{p:"400,0 300,100 200,0",c:[300,38],n:[300,80]}
};
const SOUTH={Pisces:[0,0],Aries:[0,1],Taurus:[0,2],Gemini:[0,3],Cancer:[1,3],Leo:[2,3],Virgo:[3,3],Libra:[3,2],Scorpio:[3,1],Sagittarius:[3,0],Capricorn:[2,0],Aquarius:[1,0]};
const $=id=>document.getElementById(id);
/* ---------- site language ---------- */
const LANG_DATA=window.KD_LANG||{ui:{en:{}},names:{}};
let lang="en"; try{const s=localStorage.getItem("ketana.lang"); if(LANG_DATA.ui[s])lang=s}catch(e){}
function t(k,v){
  let s=(LANG_DATA.ui[lang]&&LANG_DATA.ui[lang][k]); if(s===undefined)s=(LANG_DATA.ui.en[k]!==undefined?LANG_DATA.ui.en[k]:k);
  return v?s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!==undefined?v[x]:m):s;
}
function nm(kind,en){
  if(lang==="en"||!en)return en;
  const k=String(en).toLowerCase().replace(/[^a-z0-9]/g,"");
  const m=LANG_DATA.names[kind]&&LANG_DATA.names[kind][lang]; return (m&&m[k])||en;
}
function applyStatic(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(n=>{n.textContent=t(n.dataset.i)});
  document.querySelectorAll("[data-ip]").forEach(n=>{n.setAttribute("placeholder",t(n.dataset.ip))});
  document.querySelectorAll("[data-ia]").forEach(n=>{n.setAttribute("aria-label",t(n.dataset.ia))});
}
const state={chart:null,facts:[],model:null,style:"north",sel:null};

function el(tag,attrs,text){
  const ns=["svg","g","polygon","rect","line","text"].includes(tag)?"http://www.w3.org/2000/svg":null;
  const e=ns?document.createElementNS(ns,tag):document.createElement(tag);
  for(const k in (attrs||{})) e.setAttribute(k,attrs[k]);
  if(text!==undefined) e.textContent=text;
  return e;
}
function dms(x){
  let d=Math.floor(x), m=Math.floor((x-d)*60), s=Math.round(((x-d)*60-m)*60);
  if(s===60){s=0;m++} if(m===60){m=0;d++}
  return d+"° "+String(m).padStart(2,"0")+"′ "+String(s).padStart(2,"0")+"″";
}
function ordinal(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

function toModel(chart){
  const hs=(chart.d1Chart&&chart.d1Chart.houses)||[];
  if(hs.length!==12) throw new Error("This file does not look like a Ketana Drishti chart.");
  const houses=hs.slice().sort((a,b)=>a.number-b.number).map(h=>({
    num:h.number,sign:h.sign,signIdx:SIGNS.indexOf(h.sign),deg:h.signDegrees,nak:h.nakshatra,pada:h.pada,
    planets:(h.occupants||[]).map(o=>({name:o.celestialBody,sign:o.sign,deg:o.signDegrees,nak:o.nakshatra,pada:o.pada,
      house:o.house,retro:o.motion_type==="retrograde"&&o.celestialBody!=="Rahu"&&o.celestialBody!=="Ketu",
      dignity:(o.dignities&&o.dignities.dignity)||null,aspects:o.aspects||null}))
  }));
  return {houses,lagna:houses[0]};
}
function label(p){
  const d=DIGN[p.dignity];
  return (ABBR[p.name]||p.name.slice(0,2))+(p.retro?"ᴿ":"")+(d?d[0]:"")+" "+Math.floor(p.deg)+"°";
}

/* ---------- chart drawing ---------- */
function drawHouseText(g,h,cx,cy,sx,sy,small){
  const lines=[]; if(h.num===1) lines.push({t:"Asc "+Math.floor(h.deg)+"°",lagna:true});
  h.planets.forEach(p=>lines.push({t:label(p),p}));
  const lh=small?12:15, fs=small?11:13;
  let y=cy-((lines.length-1)*lh)/2+4;
  lines.forEach(L=>{
    const t=el("text",{x:cx,y:y,"text-anchor":"middle","font-size":fs,class:L.p?"pl":"pl"},L.t);
    if(L.p){
      t.setAttribute("tabindex","0"); t.setAttribute("role","button");
      t.setAttribute("aria-label",L.p.name+" in "+L.p.sign+", house "+L.p.house);
      t.dataset.planet=L.p.name;
      t.addEventListener("click",ev=>{ev.stopPropagation();select({type:"planet",name:L.p.name})});
      t.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select({type:"planet",name:L.p.name})}});
    } else { t.setAttribute("class","pl"); t.style.pointerEvents="none"; t.style.cursor="default"; }
    g.appendChild(t); y+=lh;
  });
  g.appendChild(el("text",{x:sx,y:sy+4,"text-anchor":"middle",class:"sn"},String(h.signIdx+1)));
}
function renderNorth(m){
  const svg=el("svg",{viewBox:"0 0 400 400",class:"chart",role:"img","aria-label":"North Indian style birth chart"});
  m.houses.forEach(h=>{
    const d=NORTH[h.num];
    const poly=el("polygon",{points:d.p,class:"cell"+(h.num===1?" lagna":""),tabindex:"0",role:"button","aria-label":"House "+h.num+", "+h.sign});
    poly.dataset.house=h.num;
    poly.addEventListener("click",()=>select({type:"house",num:h.num}));
    poly.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select({type:"house",num:h.num})}});
    svg.appendChild(poly);
  });
  svg.appendChild(el("rect",{x:1,y:1,width:398,height:398,class:"frame"}));
  svg.appendChild(el("line",{x1:0,y1:0,x2:400,y2:400,class:"frame"}));
  svg.appendChild(el("line",{x1:400,y1:0,x2:0,y2:400,class:"frame"}));
  svg.appendChild(el("polygon",{points:"200,0 400,200 200,400 0,200",class:"frame"}));
  m.houses.forEach(h=>{const d=NORTH[h.num];const g=el("g");drawHouseText(g,h,d.c[0],d.c[1],d.n[0],d.n[1],h.planets.length>4);svg.appendChild(g)});
  return svg;
}
function renderSouth(m){
  const svg=el("svg",{viewBox:"0 0 400 400",class:"chart",role:"img","aria-label":"South Indian style birth chart"});
  const bySign={}; m.houses.forEach(h=>bySign[h.sign]=h);
  SIGNS.forEach(s=>{

/* ---------- reading (Phase 3) ---------- */
async function generateReading(){
  const st=$("rstatus"), out=$("rout"); out.replaceChildren();
  if(!state.facts.length){st.textContent=t("rdNeedServer");return}
  const base=$("api").value.trim().replace(/\/$/,"");
  const scal=o=>{const r={};Object.keys(o||{}).forEach(k=>{const v=o[k];if(v===null||["string","number"].includes(typeof v))r[k]=v});return r};
  const mode=$("rmodeWrap").hidden?"classic":$("rmode").value;
  const body={facts:state.facts.map(f=>({id:f.id,text:f.text,values:scal(f.values)})),language:$("rlang").value,question:mode==="ai"?($("rq").value.trim()||null):null,mode:mode};
  $("rgo").disabled=true; st.textContent=t("rdWriting");
  try{
    const r=await fetch(base+"/api/reading",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    let d=null; try{d=await r.json()}catch(_){}
    if(!r.ok){
      let msg=t("rdFail",{n:r.status});
      if(d&&typeof d.detail==="string") msg=d.detail;
      st.textContent=msg; return}
    st.textContent="";
    const byId={}; state.facts.forEach(f=>{byId[f.id]=f.text});
    const ol=el("ol",{class:"rlist"});
    d.statements.forEach(s=>{
      const li=el("li"); li.appendChild(el("span",null,s.text)); li.appendChild(el("br"));
      s.fact_ids.forEach(id=>li.appendChild(el("span",{class:"chip",title:byId[id]||id},id)));
      (s.passage_ids||[]).forEach(id=>li.appendChild(el("span",{class:"chip pchip",title:t("rdTradition",{id:id})},id)));
      ol.appendChild(li)});
    out.appendChild(ol);
    if(d.mode==="classic") out.appendChild(el("p",{class:"rnote"},d.note||t("rdClassicNote")));
    if(d.notice) out.appendChild(el("p",{class:"rnote"},d.notice));
    if(d.mode!=="classic"&&d.passages&&d.passages.length){
      const det=el("details",{class:"rnote"}); det.appendChild(el("summary",null,t("rdMeanings",{n:d.passages.length})));
      d.passages.forEach(p=>det.appendChild(el("p",null,p.id+": "+p.text)));
      out.appendChild(det)}
    out.appendChild(el("p",{class:"rnote"},d.disclaimer));
    if(d.demo) out.appendChild(el("p",{class:"rnote"},t("rdDemo")));
    else if(d.dropped) out.appendChild(el("p",{class:"rnote"},t("rdDropped",{n:d.dropped})));
  }catch(e){
    st.textContent=t("rdNoReach")
  } finally {$("rgo").disabled=false}
}

  if(i){ if(i.datetime)parts.push(i.datetime.replace("T"," ")); if(i.timezone)parts.push(i.timezone+(i.utc_offset_hours!==undefined?" (UTC"+(i.utc_offset_hours>=0?"+":"")+i.utc_offset_hours+")":""));
    if(i.lat!==undefined)parts.push(Number(i.lat).toFixed(3)+", "+Number(i.lon).toFixed(3)); }
  if(chart.ayanamsa&&chart.ayanamsa.name) parts.push("Ayanamsa: "+chart.ayanamsa.name);

}

const PROF_KEY="ketana.profiles.v1", PROF_MAX=20;
function profilesLoad(store){

    return Array.isArray(a)?a.filter(p=>p&&typeof p.id==="string"&&typeof p.date==="string"&&typeof p.time==="string").slice(0,PROF_MAX):[]}

function profilesSave(list,store){
  try{(store||localStorage).setItem(PROF_KEY,JSON.stringify(list.slice(0,PROF_MAX)));return true}catch(e){return false}
}
function profileKey(p){return [p.name||"",p.date,p.time].join("|").toLowerCase()}
function profileUpsert(list,p){
  const i=list.findIndex(x=>profileKey(x)===profileKey(p));
  if(i>=0){p.id=list[i].id;list[i]=p}else{p.id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);list.unshift(p)}
  return list.slice(0,PROF_MAX);
}

let chosen=null, placeTimer=null, placeAbort=null, placeItems=[], placeIdx=-1;

function closeList(){const ul=$("placeList");ul.hidden=true;ul.replaceChildren();placeItems=[];placeIdx=-1;$("place").setAttribute("aria-expanded","false")}

async function lookupPlaces(q){
  if(placeAbort)placeAbort.abort(); placeAbort=new AbortController();
  const base=$("api").value.trim().replace(/\/$/,"");
  try{
    const r=await fetch(base+"/api/places?q="+encodeURIComponent(q),{signal:placeAbort.signal});
    const d=await r.json();
    if(d.unavailable){closeList();placeHint(t("sugUnavailable"));return}
    placeHint(""); drawList(d.results||[]);
    if(!(d.results||[]).length)placeHint(t("sugNone"));
  }catch(e){ if(e.name!=="AbortError"){closeList()} }
}
$("place").addEventListener("input",()=>{
  chosen=null; placeHint(""); clearTimeout(placeTimer);
  const q=$("place").value.trim();
  if(q.length<2){closeList();return}
  placeTimer=setTimeout(()=>lookupPlaces(q),300);
});
$("place").addEventListener("keydown",ev=>{
  if($("placeList").hidden)return;
  if(ev.key==="ArrowDown"){ev.preventDefault();placeIdx=(placeIdx+1)%placeItems.length;markActive()}
  else if(ev.key==="ArrowUp"){ev.preventDefault();placeIdx=(placeIdx-1+placeItems.length)%placeItems.length;markActive()}
  else if(ev.key==="Enter"&&placeIdx>=0){ev.preventDefault();pickPlace(placeItems[placeIdx])}
  else if(ev.key==="Escape"){closeList()}
});
$("place").addEventListener("blur",()=>setTimeout(closeList,120));

$("form").addEventListener("submit",async ev=>{
  ev.preventDefault(); setStatus("");

  const body={datetime:date+"T"+(time.length===5?time+":00":time),name:$("name").value.trim()||null,as_of:$("asof").value||null};
  if(useCoords){
    const lat=parseFloat($("lat").value),lon=parseFloat($("lon").value);
    if(!(lat>=-90&&lat<=90)||!(lon>=-180&&lon<=180)){setStatus(t("errCoordRange"),"err");return}
    body.lat=lat;body.lon=lon;
  } else {

    if(chosen&&chosen.label===place){body.lat=chosen.lat;body.lon=chosen.lon}else{body.place=place}
  }
  const base=$("api").value.trim().replace(/\/$/,"");
  $("go").disabled=true; setStatus(t("calculating"));
  let r;

    r=await fetch(base+"/api/chart",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  }catch(e){ setStatus(t("errServer"),"err"); $("go").disabled=false; return }
  try{

  }catch(e){

    setStatus(t("errPage",{msg:(e&&e.message)||String(e)}),"err");
  } finally {$("go").disabled=false}
});

/* ---------- misc ---------- */
$("sN").addEventListener("click",()=>{state.style="north";$("sN").setAttribute("aria-pressed","true");$("sS").setAttribute("aria-pressed","false");if(state.model)drawChart()});
$("sS").addEventListener("click",()=>{state.style="south";$("sS").setAttribute("aria-pressed","true");$("sN").setAttribute("aria-pressed","false");if(state.model)drawChart()});
[1,2,3,4].forEach(i=>$("t"+i).addEventListener("click",()=>setTab(i)));
$("rgo").addEventListener("click",generateReading);
$("rmode").addEventListener("change",()=>{$("rqWrap").hidden=$("rmode").value!=="ai"});
(async()=>{ // offer the AI style only when the server has a model available
  try{const base=$("api").value.trim().replace(/\/$/,"");const r=await fetch(base+"/api/health");const d=await r.json();
    if(d&&d.ai){$("rmodeWrap").hidden=false}}catch(_){}
})();
$("dl").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(state.chart,null,2)],{type:"application/json"}); const a=el("a");
  a.href=URL.createObjectURL(blob); a.download="chart.json"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});
$("print").addEventListener("click",()=>window.print());

/* ---------- site language switch ---------- */
function applyLang(){
  applyStatic(); $("siteLang").value=lang; $("rlang").value=lang;
  profRefresh($("profSel").value);
  if(state.model){renderDetail();renderPlanets();renderFacts();renderDasha();$("rout").replaceChildren();$("rstatus").textContent="";
    if(state.titleDefault)$("title").textContent=t("defaultTitle")}
}
$("siteLang").addEventListener("change",()=>{
  lang=$("siteLang").value; try{localStorage.setItem("ketana.lang",lang)}catch(e){}
  setStatus(""); placeHint(""); applyLang();
});
applyLang();
</script>
</body>
</html>
